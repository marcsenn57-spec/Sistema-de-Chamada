<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>USF MIGUEL KALID - Controle de Chamada</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        body { font-family: sans-serif; background: #2c3e50; color: white; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        
        #status-dia {
            background: #1a252f;
            width: 350px;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            border-left: 5px solid #2ecc71;
            font-size: 0.9rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .status-linha { display: flex; justify-content: space-between; margin-bottom: 5px; }
        .destaque-status { color: #2ecc71; font-weight: bold; font-size: 1.1rem; }

        .box { background: #1a252f; padding: 25px; border-radius: 10px; display: flex; flex-direction: column; gap: 15px; width: 350px; }
        label { font-weight: bold; font-size: 0.9rem; color: #bdc3c7; }
        input, select { padding: 12px; font-size: 1.1rem; border-radius: 5px; border: none; outline: none; background: white; color: #333; }
        
        button { padding: 15px; font-size: 1.1rem; cursor: pointer; border: none; border-radius: 5px; font-weight: bold; transition: 0.2s; }
        
        .btn-normal { background: #27ae60; color: white; }
        .btn-normal:hover { background: #2ecc71; }
        
        .btn-prioridade { background: #2980b9; color: white; }
        .btn-prioridade:hover { background: #3498db; }

        .botoes-repetir { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 5px; }
        .btn-repetir { background: #f39c12; color: white; font-size: 0.95rem; padding: 12px 5px; }
        .btn-repetir-anterior { background: #d35400; color: white; font-size: 0.95rem; padding: 12px 5px; }
        
        .area-perigo { margin-top: 15px; border-top: 1px solid #455a64; padding-top: 15px; display: flex; flex-direction: column; gap: 10px; }
        .btn-reset { color:#bdc3c7; font-size:0.7rem; cursor:pointer; border:1.5px solid #000000; background: transparent; padding: 8px; }
        .btn-limpar-hist { color: #bdc3c7; font-size:0.7rem; cursor: pointer; border: 1.5px solid #000000; background: transparent; padding: 8px; }
    </style>
</head>
<body>

    <h1>CONTROLE DE CHAMADA</h1>

    <div id="status-dia">
        <div class="status-linha">
            <span>Data:</span>
            <span id="stat-data">--/--/----</span>
        </div>
        <div class="status-linha">
            <span>Status:</span>
            <span style="color: #2ecc71;">● Sistema Ativo</span>
        </div>
        <div class="status-linha" style="margin-top: 10px; border-top: 1px solid #2c3e50; padding-top: 10px;">
            <span>Total Atendimentos:</span>
            <span id="stat-total" class="destaque-status">0</span>
        </div>
    </div>

    <div class="box">
        <label>Local / Especialidade:</label>
        <select id="sala">
            <option value="1 MÉDICO">SALA 1 - MÉDICO</option>
            <option value="2 DENTISTA">SALA 2 - DENTISTA</option>
            <option value="3 TRIAGEM">SALA 3 - TRIAGEM</option>
            <option value="4 ENFERMEIRA">SALA 4 - ENFERMEIRA</option>
            <option value="5 FISIOTERAPIA">SALA 5 - FISIOTERAPIA</option>
            <option value="6 PSICÓLOGO">SALA 6 - PSICÓLOGO</option>
            <option value="7 VACINA">SALA 7 - VACINA</option>
            <option value="8 ASSISTENTE SOCIAL">SALA 8 - ASSISTENTE SOCIAL</option>
        </select>
        
        <label>Nome do Paciente:</label>
        <input type="text" id="nome" placeholder="Digite o nome..." autocomplete="off">
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <button class="btn-normal" onclick="enviar('N')">NORMAL (N)</button>
            <button class="btn-prioridade" onclick="enviar('P')">PRIORIDADE (P)</button>
        </div>

        <div class="botoes-repetir">
            <button class="btn-repetir" onclick="repetir('ultima')">REPETIR ATUAL</button>
            <button class="btn-repetir-anterior" onclick="repetir('anterior')">REPETIR ANTERIOR</button>
        </div>

        <div class="area-perigo">
            <button class="btn-reset" onclick="resetarTudo()">Zerar Tudo (NOVO DIA)</button>
            <button class="btn-limpar-hist" onclick="limparHistoricoPainel()">Zerar Últimas Chamadas (TV)</button>
        </div>
    </div>

    <script>
        const firebaseConfig = { 
          apiKey: "AIzaSyAIRUwXKygto7BEaHie_9WvsrFQ9Z1m7T0",
          databaseURL: "https://sistemasenhas-56211-default-rtdb.firebaseio.com",
          projectId: "sistemasenhas-56211",
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function atualizarStatus() {
            const hoje = new Date().toLocaleDateString('pt-BR');
            document.getElementById('stat-data').innerText = hoje;

            let total = 0;
            for (let i = 0; i < localStorage.length; i++) {
                let chave = localStorage.key(i);
                if (chave.startsWith('cont_')) {
                    total += parseInt(localStorage.getItem(chave)) || 0;
                }
            }
            document.getElementById('stat-total').innerText = total;
        }

        function enviar(tipo) {
            const salaInput = document.getElementById('sala').value;
            const nomeInput = document.getElementById('nome');
            let nomeParaChamar = nomeInput.value.toUpperCase();
            
            if (!nomeParaChamar) return alert("Digite o nome do paciente");

            let chaveSala = `cont_${tipo}_sala_${salaInput.replace(/\s+/g, '_')}`;
            let contador = parseInt(localStorage.getItem(chaveSala)) || 0;
            contador++;
            
            localStorage.setItem(chaveSala, contador);
            
            let senhaFormatada = tipo + String(contador).padStart(2, '0');

            // Passa a chamada atual para o registro da "anterior" antes de atualizar a nova
            const ultimaAtual = localStorage.getItem('ultima_chamada');
            if (ultimaAtual) {
                localStorage.setItem('chamada_anterior', ultimaAtual);
            }

            // Salva a nova chamada como a "última"
            localStorage.setItem('ultima_chamada', JSON.stringify({
                nome: nomeParaChamar,
                sala: salaInput,
                senha: senhaFormatada
            }));

            enviarParaFirebase(nomeParaChamar, salaInput, senhaFormatada);
            
            nomeInput.value = "";
            atualizarStatus();
        }

        function repetir(tipo) {
            const chave = (tipo === 'anterior') ? 'chamada_anterior' : 'ultima_chamada';
            const dados = JSON.parse(localStorage.getItem(chave));
            
            if (!dados) {
                return alert(tipo === 'anterior' ? "Não há chamada anterior registrada!" : "Não há chamada atual para repetir!");
            }
            
            enviarParaFirebase(dados.nome, dados.sala, dados.senha);
        }

        function enviarParaFirebase(nome, sala, senha) {
            db.ref('chamada').set({
                nome: nome,
                sala: sala,
                senha: senha,
                timestamp: Date.now()
            });
        }

        function resetarTudo() {
            if (confirm("Isso voltará todos os contadores para 1 e limpará a TV. Confirma?")) {
                localStorage.clear();
                db.ref('chamada').set({
                    nome: "AGUARDANDO...",
                    sala: "--",
                    senha: "---",
                    timestamp: Date.now()
                }).then(() => {
                    atualizarStatus();
                    location.reload();
                });
            }
        }

        function limparHistoricoPainel() {
            if (confirm("Deseja realmente apagar o histórico de senhas da TV?")) {
                db.ref('chamada').update({
                    comando: "LIMPAR_HISTORICO",
                    timestamp: Date.now() 
                }).then(() => {
                    alert("Comando enviado!");
                    setTimeout(() => db.ref('chamada').update({ comando: "" }), 2000);
                });
            }
        }

        atualizarStatus();
    </script>
</body>
</html>
